name: dart_desk_server
description: Serverpod backend server for Dart Desk, a headless CMS with CRDT collaboration, media management, and versioned content.
version: 0.1.2
repository: https://github.com/ThangVuNguyenViet/dart_desk_be
topics:
  - cms
  - serverpod
  - headless-cms
  - backend

resolution: workspace

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  serverpod: ^3.5.0-beta.5
  crdt: ^5.1.3
  uuid: ^4.5.1
  dbcrypt: ^2.0.0
  archive: ^4.0.2
  path: ^1.9.0
  crypto: ^3.0.0
  mime: ^2.0.0
  http_parser: ^4.0.2
  amazon_cognito_identity_dart_2: ^3.8.0
  http: ^1.1.0
  image: ^4.5.0
  blurhash_dart: ^1.2.1
  exif: ^3.3.0
  serverpod_auth_core_server: ^3.5.0-beta.5
  serverpod_auth_idp_server: ^3.5.0-beta.5
  serverpod_cloud_storage_s3: ^3.5.0-beta.5
  serverpod_cloud_storage_s3_compat: ^3.5.0-beta.5
  mailer: ^7.1.0

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  test: '^1.24.2'
  serverpod_test: ^3.5.0-beta.5
  mocktail: ^1.0.4
  coverage: ^1.15.0
