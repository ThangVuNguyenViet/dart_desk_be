class: CmsClient
table: clients
fields:
  id: UuidValue, defaultModel=random
  name: String
  slug: String
  description: String?
  isActive: bool, default=true
  settings: String?
  createdAt: DateTime?, default=now
  updatedAt: DateTime?, default=now
indexes:
  clients_slug_idx:
    fields: slug
    unique: true
  clients_is_active_idx:
    fields: isActive
