class: Deployment
table: deployments
fields:
  id: UuidValue, defaultModel=random
  projectId: UuidValue, relation(parent=projects, onDelete=Restrict)
  version: int
  status: DeploymentStatus
  filePath: String
  fileSize: int?
  uploadedByUserId: UuidValue?, relation(parent=users, onDelete=SetNull)
  commitHash: String?
  metadata: String?
  createdAt: DateTime?, default=now
  updatedAt: DateTime?, default=now
indexes:
  deployment_project_idx:
    fields: projectId
  deployment_project_version_idx:
    fields: projectId, version
    unique: true
  deployment_project_status_idx:
    fields: projectId, status
