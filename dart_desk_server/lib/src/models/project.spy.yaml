class: Project
table: projects
fields:
  clientId: int, relation(parent=clients, onDelete=Cascade)
  name: String
  slug: String
  description: String?
  isActive: bool, default=true
  settings: String?
  createdAt: DateTime?, default=now
  updatedAt: DateTime?, default=now
  createdByUserId: int?, relation(parent=users, onDelete=SetNull)
  updatedByUserId: int?, relation(parent=users, onDelete=SetNull)
  deletedAt: DateTime?
indexes:
  projects_client_idx:
    fields: clientId
  projects_slug_idx:
    fields: slug
    unique: true
  projects_is_active_idx:
    fields: isActive
