class: Project
table: projects
fields:
  id: UuidValue, defaultModel=random
  clientId: UuidValue, relation(parent=clients, onDelete=Cascade)
  name: String
  slug: String
  deployHostname: String
  description: String?
  isActive: bool, default=true
  settings: String?
  createdAt: DateTime?, default=now
  updatedAt: DateTime?, default=now
  createdByUserId: UuidValue?, relation(parent=users, onDelete=SetNull)
  updatedByUserId: UuidValue?, relation(parent=users, onDelete=SetNull)
  deletedAt: DateTime?
indexes:
  projects_client_idx:
    fields: clientId
  projects_is_active_idx:
    fields: isActive
