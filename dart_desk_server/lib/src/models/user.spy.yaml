class: User
table: users
fields:
  id: UuidValue, defaultModel=random
  clientId: UuidValue?
  email: String
  name: String?
  role: ClientRole, default=viewer
  isActive: bool, default=true
  serverpodUserId: String?
  createdAt: DateTime?, default=now
  updatedAt: DateTime?, default=now
  deletedAt: DateTime?
indexes:
  users_client_email_idx:
    fields: clientId, email
    unique: true
  users_client_id_idx:
    fields: clientId
  users_serverpod_user_id_idx:
    fields: serverpodUserId
  users_is_active_idx:
    fields: isActive
