class: Document
table: documents
fields:
  projectId: int, relation(parent=projects, onDelete=Cascade)
  documentType: String
  title: String
  slug: String
  isDefault: bool, default=false
  data: String?
  crdtNodeId: String?
  crdtHlc: String?
  publishedAt: DateTime?
  createdAt: DateTime?, default=now
  updatedAt: DateTime?, default=now
  createdByUserId: int?, relation(parent=users, onDelete=SetNull)
  updatedByUserId: int?, relation(parent=users, onDelete=SetNull)
indexes:
  documents_project_type_idx:
    fields: projectId, documentType
  documents_project_type_slug_idx:
    fields: projectId, documentType, slug
    unique: true
  documents_type_default_idx:
    fields: documentType, isDefault
  documents_created_at_idx:
    fields: createdAt
  documents_project_published_idx:
    fields: projectId, publishedAt
