class: Document
table: documents
fields:
  id: UuidValue, defaultModel=random
  projectId: UuidValue, relation(parent=projects, onDelete=Cascade)
  documentType: String
  title: String
  slug: String
  isDefault: bool, default=false
  data: String?
  crdtNodeId: String?
  crdtHlc: String?
  createdAt: DateTime?, default=now
  updatedAt: DateTime?, default=now
  createdByUserId: UuidValue?, relation(parent=users, onDelete=SetNull)
  updatedByUserId: UuidValue?, relation(parent=users, onDelete=SetNull)
  deletedAt: DateTime?
indexes:
  documents_project_type_idx:
    fields: projectId, documentType
  documents_project_type_slug_idx:
    fields: projectId, documentType, slug
  documents_type_default_idx:
    fields: documentType, isDefault
  documents_created_at_idx:
    fields: createdAt
