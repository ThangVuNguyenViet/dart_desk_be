class: ProjectMember
table: project_members
fields:
  id: UuidValue, defaultModel=random
  userId: UuidValue, relation(parent=users, onDelete=Cascade)
  projectId: UuidValue, relation(parent=projects, onDelete=Cascade)
  role: ProjectRole
  createdAt: DateTime?, default=now
indexes:
  project_member_unique:
    fields: userId, projectId
    unique: true
  project_member_project_idx:
    fields: projectId
