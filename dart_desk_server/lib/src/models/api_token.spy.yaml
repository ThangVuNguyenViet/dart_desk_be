class: ApiToken
table: api_tokens
fields:
  id: UuidValue, defaultModel=random
  projectId: UuidValue, relation(parent=projects, onDelete=Cascade)
  name: String
  tokenHash: String
  tokenPrefix: String
  tokenSuffix: String
  role: String
  createdByUserId: UuidValue?, relation(parent=users, onDelete=SetNull)
  lastUsedAt: DateTime?
  expiresAt: DateTime?
  isActive: bool, default=true
  createdAt: DateTime?, default=now
indexes:
  api_token_project_idx:
    fields: projectId
  api_token_lookup_idx:
    fields: projectId, tokenPrefix, tokenSuffix
    unique: true
  api_token_prefix_suffix_idx:
    fields: tokenPrefix, tokenSuffix
